# Publish a from-source Swift Android SDK image for local/CI reuse.
# F-Droid must NOT consume this image — it rebuilds via scripts/fdroid-prebuild.sh.
name: swift-android-sdk

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/build-swift-android-sdk.sh'
      - 'native/OfflineMapServer/swift-android-sdk/**'
      - 'deploy/docker/swift-android-sdk/**'
      - '.github/workflows/swift-android-sdk.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sms-loc-fdroid/swift-android-sdk
  TAG: 6.2.3-aarch64-api24

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/swift-android-sdk/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=smsloc-swift-android-sdk
            org.opencontainers.image.description=From-source Swift Android SDK (aarch64); not for F-Droid
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
