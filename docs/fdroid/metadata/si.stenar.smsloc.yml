Builds:
  - versionName: 0.0.15
    versionCode: 15
    commit: v0.0.15
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates xz-utils python3 gnupg unzip libncurses6
        libncursesw6 libcurl4 libxml2 libsqlite3-0 zlib1g libedit2 libgcc-s1 libstdc++6
        binutils
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - corepack enable
      - corepack prepare yarn@1.22.22 --activate
    gradle:
      - yes
    prebuild:
      - cd ..
      - ./scripts/fdroid-prebuild.sh
    scandelete:
      - ../node_modules
      - ../native/OfflineMapServer/.build
      - ../.fdroid-swift

MaintainerNotes: |-
  Capacitor/Ionic Vue app. Offline maps use a Swift (Vapor) static server
  cross-compiled with the official Swift Android SDK 6.3.3 + NDK r27d;
  see native/OfflineMapServer/README.md, docs/fdroid.md and
  scripts/fdroid-prebuild.sh (Ubuntu 24.04 host toolchain tarball — swiftly
  does not support Debian Trixie on the F-Droid buildserver). Host needs
  libncurses6 and related runtime libs. jniLibs are produced in prebuild and
  must not be committed. Expect large APK (~arm64 + ~87MB Swift runtime).

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: android/app/build.gradle|versionCode\s+(\d+)|.|versionName\s+"([^"]+)"
