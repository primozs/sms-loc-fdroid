Builds:
  - versionName: 0.0.25
    versionCode: 25
    commit: b6879cb32dc403e1c5a66305f160f146138ebc27
    timeout: 14400
    subdir: android/app
    ndk: r27d
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates xz-utils python3 python-is-python3
        gnupg unzip libncurses6 libncursesw6 libcurl4 libxml2 libsqlite3-0 zlib1g
        zlib1g-dev libedit2 libgcc-s1 libstdc++6 binutils build-essential gcc g++
        libc6-dev ninja-build git perl patch cmake patchelf
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky swiftlang nodejs npm
      - corepack enable
      - corepack prepare yarn@1.22.22 --activate
    gradle:
      - yes
    # Yarn + Swift SDK + JNI package before scandelete so downloads are visible.
    prebuild:
      - cd ../..
      - ./scripts/fdroid-prebuild.sh

MaintainerNotes: |-
  Capacitor/Ionic Vue app. Offline maps use a Swift (Vapor) static server
  cross-compiled in prebuild via scripts/fdroid-prebuild.sh (before the
  scanner, so yarn/Swift downloads are visible — not hidden under build:).
  Host tools from Debian forky pin: nodejs/npm (Capacitor 8 needs ≥22; trixie
  is 20.x) and swiftlang 6.2.3 (trixie is 6.0.3; Package.swift needs ≥6.2).
  yarn --ignore-engines kept as belt-and-suspenders. Target Android stdlib /
  Dispatch / Foundation are rebuilt from swift-6.2.3-RELEASE sources
  (scripts/build-swift-android-sdk.sh). LibXml2 for Foundation is built from
  gnome/libxml2 (--static-libxml2); FoundationNetworking is off (no curl).
  libandroid-spawn is compiled from vendored source under
  native/libandroid-spawn/ (not packages.termux.dev). Only remaining Termux
  deb is libandroid-execinfo (Testing backtrace). NDK r27d via recipe ndk:
  (also supplies clang/lld for the Android stdlib link — Debian clang cannot
  resolve -lgcc for that target). CMake ≥3.26 and patchelf from Debian
  packages (sudo); scripts do not curl them or the NDK zip. No NodeSource;
  no Swift.org host tarball in the F-Droid recipe. Expect large APK
  (~arm64 + ~100MB Swift runtime) and a long build. SQLite: app opens the DB
  unencrypted; @capacitor-community/sqlite still pulls FLOSS sqlcipher-android
  from Maven as a hard plugin dependency — see docs/fdroid.md reply draft.

