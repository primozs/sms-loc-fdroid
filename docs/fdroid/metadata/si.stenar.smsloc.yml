AutoName: SMSLocFD

RepoType: git
Repo: https://github.com/primozs/sms-loc-fdroid.git

Builds:
  - versionName: 0.0.16
    versionCode: 16
    commit: v0.0.16
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates xz-utils python3 gnupg unzip libncurses6
        libncursesw6 libcurl4 libxml2 libsqlite3-0 zlib1g libedit2 libgcc-s1 libstdc++6
        binutils build-essential gcc g++ libc6-dev
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
      - corepack enable
      - corepack prepare yarn@1.22.22 --activate
    gradle:
      - yes
    prebuild:
      - cd ..
      - ./scripts/fdroid-prebuild.sh
    scanignore:
      - android/app/src/main/jniLibs

MaintainerNotes: |-
  Capacitor/Ionic Vue app. Offline maps use a Swift (Vapor) static server
  cross-compiled in prebuild via scripts/fdroid-prebuild.sh (Ubuntu 24.04 host
  toolchain under $HOME + official Swift Android SDK 6.3.3 + NDK r27d).
  android/app/src/main/jniLibs is scanignored: OfflineMapServerCore/JNI are
  built from native/OfflineMapServer; remaining .so are the Swift Android
  runtime / NDK libc++ pulled by that build (see package-android-jni.sh).
  Expect large APK (~arm64 + ~87MB Swift runtime).

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: android/app/build.gradle|versionCode\s+(\d+)|.|versionName\s+"([^"]+)"
CurrentVersion: 0.0.16
CurrentVersionCode: 16
