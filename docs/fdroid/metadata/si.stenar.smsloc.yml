      - ./scripts/fdroid-prebuild.sh

MaintainerNotes: |-
  Capacitor/Ionic Vue app. Offline maps use a Swift (Vapor) static server
  cross-compiled in build via scripts/fdroid-prebuild.sh (after the scanner).
  Host tools from Debian forky pin: nodejs/npm (Capacitor 8 needs ≥22; trixie
  is 20.x) and swiftlang 6.2.3 (trixie is 6.0.3; Package.swift needs ≥6.2).
  yarn --ignore-engines kept as belt-and-suspenders. Target Android stdlib /
  Dispatch / Foundation are rebuilt from swift-6.2.3-RELEASE sources
  (scripts/build-swift-android-sdk.sh). NDK r27d remains a downloaded build
  tool (also supplies clang/lld for the Android stdlib link — Debian clang
  cannot resolve -lgcc for that target). No NodeSource; no Swift.org host
  tarball in the F-Droid recipe. CMake ≥3.26 / patchelf auto-fetched into
  $HOME/.cache when missing. Expect large APK (~arm64 + ~100MB Swift runtime)
  and a long build.

